# Terragrunt plan and apply with platform-deploy-role, for my-org.
# Generated by aws-account-bootstrap. Copy to .github/workflows/ in a platform
# repository (infrastructure), next to infrastructure/live/root.hcl.
#
#   pull request         plan  in dev
#   push to main         apply in dev
#   Run workflow         plan or apply in any environment: dev, production
#
# Each run happens in the GitHub environment of the same name. The role's trust policy
# matches on it, and AWS_PLATFORM_ROLE_ARN and AWS_REGION come from it — so an apply is
# only as guarded as that environment's protection rules. Add required reviewers to
# every environment but dev before its first apply.
name: terragrunt

on:
  pull_request:
    paths: ["infrastructure/**"]
  push:
    branches: [main]
    paths: ["infrastructure/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment, and the directory under infrastructure/live/
        type: choice
        options:
          - dev
          - production
      command:
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  id-token: write # exchange the job's OIDC token for the role
  contents: read

# One run per environment at a time; never cancel an apply halfway.
concurrency:
  group: terragrunt-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "1.13.0"
  TERRAGRUNT_VERSION: "0.86.2"

jobs:
  terragrunt:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }} # required: the trust policy matches on it
    env:
      COMMAND: ${{ inputs.command || (github.event_name == 'push' && 'apply' || 'plan') }}
    defaults:
      run:
        working-directory: infrastructure/live/${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Terragrunt
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p bin
          curl -fsSLo bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"
          chmod +x bin/terragrunt
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      # `run --all apply` adds -auto-approve: the approval is the environment's reviewers.
      - name: terragrunt ${{ env.COMMAND }}
        run: terragrunt run --all --non-interactive "${COMMAND}"
