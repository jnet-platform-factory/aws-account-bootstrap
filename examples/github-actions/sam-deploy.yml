# Build and deploy a SAM application with app-deploy-role, for my-org.
# Generated by aws-account-bootstrap. Copy to .github/workflows/ in an application
# repository (api-service worker-service).
#
#   push to main         deploy to dev
#   Run workflow         deploy to any environment: dev, production
#
# The job assumes AWS_APP_ROLE_ARN, which can only drive CloudFormation, and passes
# AWS_CFN_EXEC_ROLE_ARN to it, which creates the stack's resources. Both, and
# AWS_REGION, come from the GitHub environment the job runs in — so a deploy is only
# as guarded as that environment's protection rules.
name: sam-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options:
          - dev
          - production

permissions:
  id-token: write # exchange the job's OIDC token for the role
  contents: read

# One deploy per environment at a time; a stack update cannot be cancelled cleanly.
concurrency:
  group: sam-deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }} # required: the trust policy matches on it
    env:
      STAGE: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: sam build

      # Without --role-arn CloudFormation would act as the deploy role, which has no
      # service permissions, and the deploy fails: that is the control working.
      - run: >
          sam deploy
          --stack-name "${{ github.event.repository.name }}-${STAGE}"
          --role-arn "${{ vars.AWS_CFN_EXEC_ROLE_ARN }}"
          --region "${{ vars.AWS_REGION }}"
          --resolve-s3
          --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND
          --no-confirm-changeset
          --no-fail-on-empty-changeset
